<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Banking data pipeline workflow</title>
<desc>Eight raw relational tables flow through exploratory analysis, loan-level feature engineering, class imbalance handling, and model training, ending with the best-performing Gradient Boosted Trees model.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="580" fill="#ffffff"/>

<g>
<rect x="120" y="20" width="440" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Raw relational tables</text>
<text x="340" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444441">8 tables · 1M+ transactions · 5,369 clients</text>
</g>

<line x1="340" y1="76" x2="340" y2="116" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="116" width="560" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">Exploratory data analysis</text>
<text x="340" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#085041">Spark SQL profiling of branches, demographics, loans</text>
</g>

<line x1="340" y1="172" x2="340" y2="212" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="212" width="560" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="340" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">Loan-level feature engineering</text>
<text x="340" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#712B13">Layered CTE joins, outlier checks, recoding</text>
</g>

<line x1="340" y1="268" x2="340" y2="308" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="308" width="560" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#412402">Class imbalance handling</text>
<text x="340" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#633806">Under-sampling, over-sampling, SMOTE compared</text>
</g>

<line x1="340" y1="364" x2="340" y2="404" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="404" width="560" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#042C53">Model training in Spark MLlib</text>
<text x="340" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">Logistic regression, random forest, gradient boosted trees</text>
</g>

<line x1="340" y1="460" x2="340" y2="500" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="140" y="500" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Best result: gradient boosted trees</text>
<text x="340" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">AUC 0.71 on loan default prediction</text>
</g>
</svg>
